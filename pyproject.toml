[project]
name = "perplexity-calculator"
version = "0.1.0"
description = "A perplexity calculator for Large Language Models using ONNX Runtime GenAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.18.0",
    "numpy>=2.5.1",
    "onnxruntime-genai>=0.14.1",
    "tokenizers>=0.23.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "memray>=1.19.3",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.pyrefly]
search-path = ["typings"]
site-package-path = ["typings"]
infer-with-first-use = false

[tool.ty.environment]
extra-paths = ["typings"]
